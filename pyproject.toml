[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfraud-detect"
version = "0.2.0"
description = "External paper fraud detection CLI — statistical, image, and text forensics for life sciences papers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "PyMuPDF>=1.23.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "Jinja2>=3.1.0",
    "httpx>=0.25.0",
    "PyYAML>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: MacOS",
]
keywords = ["fraud-detection", "academic-integrity", "statistics", "forensics", "life-sciences"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
web = [
    "streamlit>=1.28.0",
]
docx = [
    "python-docx>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/guandu52-oss/paperfraud"
Documentation = "https://github.com/guandu52-oss/paperfraud#readme"
Repository = "https://github.com/guandu52-oss/paperfraud"
Issues = "https://github.com/guandu52-oss/paperfraud/issues"

[project.scripts]
paperfraud = "paperfraud.cli:app"

[tool.setuptools.packages.find]
where = ["."]
